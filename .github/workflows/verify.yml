name: Verify OpenDesign CLI image and Paseo launcher
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify-image-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:launcher
      - run: npm run check
      - run: docker build -f image/Dockerfile -t opendesign-cli-image:test .
  verify-launcher-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:launcher
      - run: npm audit --omit=dev
      - run: npm audit --omit=dev --prefix vendor/pi-paseo/runtime

  verify-auth-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: node --test tests/launcher-auth-browser.test.mjs
        env:
          PASEO_REQUIRE_AUTH_BROWSER: '1'
