name: Verify OpenDesign CLI image and Paseo launcher
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify-image-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run check:tests
      - run: npm run test:extended
      - run: npm run check:launcher
      - run: npm run check
      - run: npm run check:vendor
      - run: docker build -f image/Dockerfile -t opendesign-cli-image:test .
  verify-launcher-node22:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: npm run test:launcher
      - run: npm audit --omit=dev
      - run: npm audit --omit=dev --prefix vendor/pi-paseo/runtime

  verify-auth-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Configure bounded Ubuntu dependency downloads
        timeout-minutes: 2
        run: |
          # The Azure Ubuntu mirror exhausted the previous job's 10-minute limit.
          # Keep Ubuntu's signed repositories, using the official archive mirror.
          sudo python3 - <<'PY'
          from pathlib import Path

          sources = [Path('/etc/apt/sources.list'), Path('/etc/apt/apt-mirrors.txt')]
          sources += list(Path('/etc/apt/sources.list.d').glob('*.list'))
          sources += list(Path('/etc/apt/sources.list.d').glob('*.sources'))
          for path in sources:
              if path.is_file():
                  original = path.read_text()
                  updated = original.replace('http://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  updated = updated.replace('https://azure.archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu')
                  if updated != original:
                      path.write_text(updated)
                      print(f'Using official Ubuntu archive in {path}')
          Path('/etc/apt/apt.conf.d/80-paseo-ci-downloads').write_text(
              'Acquire::Retries "3";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n'
          )
          PY
      - name: Install pinned Playwright
        timeout-minutes: 3
        run: python -m pip install playwright==1.62.0
      - name: Install Chromium and system dependencies
        timeout-minutes: 12
        run: python -m playwright install --with-deps chromium
      - name: Run required browser acceptance tests
        timeout-minutes: 3
        run: node --test tests/launcher-auth-browser.test.mjs
        env:
          PASEO_REQUIRE_AUTH_BROWSER: '1'
