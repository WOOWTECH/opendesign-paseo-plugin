name: Verify OpenDesign CLI image
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify-image-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - run: npm run check
      - run: docker build -f image/Dockerfile -t opendesign-cli-image:test .
